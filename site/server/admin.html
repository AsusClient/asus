<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asus.wtf — key admin</title>
<style>
  :root { color-scheme: dark; --bg:#06040d; --panel:#120d22; --line:rgba(255,255,255,.1); --ink:#f5f2ff; --dim:#c3bcdd; --mut:#8f87aa; --accent:#a78bfa; --mono:ui-monospace,Menlo,monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(1200px 800px at 50% -10%,rgba(167,139,250,.12),transparent), var(--bg); color:var(--ink); font:15px/1.6 Inter,system-ui,sans-serif; }
  header { padding:22px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.1rem; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .stats { margin-left:auto; display:flex; gap:18px; font-family:var(--mono); font-size:.78rem; color:var(--mut); }
  .stats b { color:var(--ink); font-weight:600; }
  main { padding:26px 28px 60px; max-width:1400px; margin:0 auto; }
  .panel { border:1px solid var(--line); border-radius:18px; background:radial-gradient(800px 400px at 50% 0%,rgba(167,139,250,.08),transparent), rgba(255,255,255,.02); padding:26px; margin-bottom:24px; }
  .panel-header { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
  .panel-header h2 { margin:0; font-size:.9rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  .panel-header p { margin:6px 0 0; color:var(--mut); font-size:.9rem; }
  .preset-row { display:flex; flex-wrap:wrap; gap:8px; }
  .preset { border:1px solid transparent; background:rgba(255,255,255,.04); color:var(--dim); border-radius:999px; padding:7px 14px; font:inherit; font-size:.86rem; cursor:pointer; }
  .preset.active { background:linear-gradient(135deg,rgba(180,155,255,.9),rgba(124,92,255,.9)); color:#0a0614; font-weight:600; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; align-items:end; }
  label { display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin-bottom:8px; }
  input, select { width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink); font:inherit; font-size:.9rem; }
  .duration { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; }
  button { padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink); font:inherit; font-size:.88rem; font-weight:600; cursor:pointer; }
  button.primary { border-color:transparent; background:linear-gradient(135deg,#c9b8ff,#7c5cff); color:#0a0614; }
  button.ghost { background:transparent; }
  button.danger { border-color:rgba(255,110,110,.5); color:#ff9d9d; }
  button.small { padding:6px 12px; border-radius:999px; font-size:.8rem; }
  .output { margin-top:18px; padding:18px; border-radius:14px; background:rgba(9,7,19,.9); border:1px solid var(--line); font-family:var(--mono); font-size:.88rem; color:#e7e0ff; white-space:pre-wrap; word-break:break-all; display:none; flex-direction:column; gap:12px; }
  .output.show { display:flex; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; }
  .search { display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:999px; border:1px solid var(--line); }
  .search input { border:none; background:transparent; padding:0; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th { text-align:left; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mut); padding:10px 14px; border-bottom:1px solid var(--line); }
  td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.05); }
  code { font-family:var(--mono); color:#e7e0ff; }
  .tag { display:inline-flex; padding:4px 10px; border-radius:999px; font-size:.76rem; font-family:var(--mono); }
  .t-active { background:rgba(110,242,176,.16); color:#7dffbf; }
  .t-dead { background:rgba(255,110,110,.16); color:#ff9f9f; }
  .t-unbound { background:rgba(167,139,250,.18); color:#d7c8ff; }
  .row-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  .empty { color:var(--mut); padding:18px 14px; }
  .toast { position:fixed; right:20px; bottom:20px; padding:10px 18px; border-radius:999px; background:rgba(167,139,250,.25); border:1px solid rgba(167,139,250,.6); opacity:0; transform:translateY(12px); transition:all .25s ease; pointer-events:none; }
  .toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<header>
  <h1>asus<span>.</span>wtf / keys</h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="panel">
    <div class="panel-header">
      <div>
        <h2>Generate keys</h2>
        <p>Duration down to seconds. For 2 PCs use the preset.</p>
      </div>
      <div class="preset-row">
        <button class="preset" data-uses="1">1 PC</button>
        <button class="preset active" data-uses="2">2 PCs</button>
        <button class="preset" data-uses="3">3 PCs</button>
        <button class="preset" data-uses="5">5 PCs</button>
      </div>
    </div>
    <div class="preset-row" style="margin-bottom:18px">
      <button class="preset" data-time="3" data-unit="s">3s</button>
      <button class="preset" data-time="30" data-unit="m">30m</button>
      <button class="preset" data-time="1" data-unit="h">1h</button>
      <button class="preset" data-time="12" data-unit="h">12h</button>
      <button class="preset active" data-time="1" data-unit="d">1d</button>
      <button class="preset" data-time="3" data-unit="d">3d</button>
      <button class="preset" data-time="1" data-unit="w">1w</button>
      <button class="preset" data-time="2" data-unit="w">2w</button>
      <button class="preset" data-time="1" data-unit="mo">1mo</button>
      <button class="preset" data-time="3" data-unit="mo">3mo</button>
      <button class="preset" data-time="1" data-unit="y">1y</button>
      <button class="preset" data-time="0" data-unit="d">Never</button>
    </div>
    <form id="genForm">
      <div><label>Count</label><input id="count" type="number" min="1" max="200" value="10"></div>
      <div><label>Uses per key</label><input id="uses" type="number" min="1" max="20" value="2"></div>
      <div style="grid-column:span 2">
        <label>Duration</label>
        <div class="duration">
          <input id="durAmount" type="number" min="0" value="1">
          <select id="durUnit">
            <option value="s">Seconds</option>
            <option value="m">Minutes</option>
            <option value="h">Hours</option>
            <option value="d" selected>Days</option>
            <option value="w">Weeks</option>
            <option value="mo">Months</option>
            <option value="y">Years</option>
          </select>
        </div>
      </div>
      <div><label>Note / plan</label><input id="note" type="text" maxlength="40"></div>
      <div class="actions"><button class="primary" type="submit">Generate keys</button><button class="ghost" type="button" id="copyAll" disabled>Copy all</button></div>
    </form>
    <div class="output" id="output">
      <div style="display:flex;align-items:center;justify-content:space-between"><span>Generated keys</span><button class="small" id="copyAll2">Copy all</button></div>
      <pre id="outputList" style="margin:0"></pre>
    </div>
  </section>
  <section class="panel">
    <div class="panel-header">
      <div>
        <h2>Key list</h2>
        <p>Search, copy, unbind or revoke.</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="search"><input id="search" placeholder="Search key, note or status" autocomplete="off"></div>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div id="tableWrap"><p class="empty">Loading…</p></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=toast;t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1400);};
const fmt=ms=>ms?new Date(ms).toLocaleString():'never';
const rel=ms=>{if(!ms)return'never';const d=ms-Date.now();if(d<0)return'expired';const s=Math.floor(d/1000),m=Math.floor(s/60),h=Math.floor(m/60),dd=Math.floor(h/24),mo=Math.floor(dd/30),y=Math.floor(dd/365);if(y)return'in '+y+'y';if(mo)return'in '+mo+'mo';if(dd)return'in '+dd+'d';if(h)return'in '+h+'h '+(m%60)+'m';if(m)return'in '+m+'m';return'in '+s+'s';};
const u2ms=u=>u=='s'?1000:u=='m'?60000:u=='h'?3600000:u=='d'?86400000:u=='w'?604800000:u=='mo'?2592000000:31536000000;
let keys=[],last=[];
async function load(){const r=await fetch('/api/admin/keys');const d=await r.json();keys=d.keys;stats.innerHTML='<span>total <b>'+d.stats.total+'</b></span><span>active <b>'+d.stats.active+'</b></span><span>bound <b>'+d.stats.bound+'</b></span><span>revoked <b>'+d.stats.revoked+'</b></span>';render();}
function render(){const q=search.value.toLowerCase();const list=keys.filter(e=>{const st=e.revoked?'revoked':e.expiresAt&&e.expiresAt<Date.now()?'expired':(e.hwids||[]).length?'active':'unused';return (e.key+e.note+st).toLowerCase().includes(q);});if(!list.length){tableWrap.innerHTML='<p class="empty">No keys</p>';return;}tableWrap.innerHTML='<table><thead><tr><th>Key</th><th>Note</th><th>Uses</th><th>Created</th><th>Expires</th><th>Last seen</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(e=>{const st=e.revoked?'revoked':e.expiresAt&&e.expiresAt<Date.now()?'expired':(e.hwids||[]).length?'active':'unused';return '<tr><td><code>'+e.key+'</code></td><td>'+(e.note||'-')+'</td><td>'+(e.hwids||[]).length+'/'+e.maxUses+'</td><td>'+fmt(e.createdAt)+'</td><td>'+(e.expiresAt?rel(e.expiresAt):'never')+'</td><td>'+(e.lastSeenAt?fmt(e.lastSeenAt):'-')+'</td><td><span class="tag t-'+(st=='active'?'active':st=='unbound'?'unbound':'dead')+'">'+st+'</span></td><td class="row-actions"><button class="small" data-copy="'+e.key+'">Copy</button><button class="small" data-unbind="'+e.key+'">Unbind</button>'+(st=='revoked'?'':'<button class="small danger" data-revoke="'+e.key+'">Revoke</button>')+'</td></tr>';}).join('')+'</tbody></table>';}
search.oninput=render;refresh.onclick=load;
document.querySelectorAll('[data-uses]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-uses]').forEach(x=>x.classList.remove('active'));b.classList.add('active');uses.value=b.dataset.uses;});
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-time]').forEach(x=>x.classList.remove('active'));b.classList.add('active');durAmount.value=b.dataset.time;durUnit.value=b.dataset.unit;});
genForm.onsubmit=async e=>{e.preventDefault();const amt=+durAmount.value,unit=durUnit.value,expiresAtMs=amt?Date.now()+amt*u2ms(unit):null;const res=await fetch('/api/admin/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count:+count.value,uses:+uses.value,note:note.value.trim(),expiresAtMs})}).then(r=>r.json());last=res.keys;outputList.textContent=res.keys.join('\n');output.classList.add('show');copyAll.disabled=false;copyAll2.disabled=false;toast(res.keys.length+' generated');load();};
const ca=()=>{if(!last.length)return;navigator.clipboard.writeText(last.join('\n'));toast('Copied all');};copyAll.onclick=ca;copyAll2.onclick=ca;
document.onclick=async e=>{const t=e.target;if(t.dataset.copy){navigator.clipboard.writeText(t.dataset.copy);toast('Copied');}if(t.dataset.revoke){if(!confirm('Revoke '+t.dataset.revoke+'?'))return;await fetch('/api/admin/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:t.dataset.revoke})});toast('Revoked');load();}if(t.dataset.unbind){if(!confirm('Unbind '+t.dataset.unbind+'?'))return;await fetch('/api/admin/unbind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:t.dataset.unbind})});toast('Unbound');load();}};
load();setInterval(load,30000);
</script>
</body>
</html>
